<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>绥滨运达220千伏送出工程 · 管理看板</title>
<style>
  /* ===== 国网绿主题变量 ===== */
  :root {
    /* 国网绿主色 */
    --green: #00923F;
    --green-dark: #007a34;
    --green-light: #2ecc71;
    --green-pale: #e8f5ec;
    /* 背景（亮色调） */
    --bg-1: #eef5f0;
    --bg-2: #e3efe6;
    --bg-3: #d8e9dc;
    /* 卡片 */
    --surface: #ffffff;
    --surface-hover: #f6faf7;
    --border: #d4e6d9;
    --border-soft: #e6f0e8;
    /* 文字 */
    --text: #1a2e22;
    --text-soft: #4a6654;
    --text-mute: #8ba193;
    /* 其他 */
    --accent: var(--green);
    --radius: 12px;
    --radius-sm: 8px;
    --shadow: 0 2px 12px rgba(0, 146, 63, 0.08);
    --shadow-hover: 0 6px 20px rgba(0, 146, 63, 0.14);
    --font: "PingFang SC", "Microsoft YaHei", -apple-system, system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { height: 100vh; overflow: hidden; }
  body {
    height: 100vh;
    overflow: hidden;
    background:
      radial-gradient(1100px 500px at 90% -5%, rgba(0, 146, 63, 0.08) 0%, transparent 55%),
      radial-gradient(800px 400px at 0% 0%, rgba(46, 204, 113, 0.06) 0%, transparent 50%),
      linear-gradient(160deg, var(--bg-1) 0%, var(--bg-2) 55%, var(--bg-3) 100%);
    color: var(--text);
    font-family: var(--font);
    font-size: 13px;
    padding: 10px 18px;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    height: calc(100vh - 20px);
    display: flex;
    flex-direction: column;
    max-width: 1680px;
    margin: 0 auto;
    overflow: hidden;
  }

  /* ===== 头部 ===== */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
    gap: 12px;
    height: 72px;
    padding: 0 4px;
  }
  .header-left { display: flex; align-items: center; gap: 16px; min-width: 0; }
  .logo {
    height: 64px;
    display: flex;
    align-items: center;
    flex-shrink: 0;
    filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.08));
  }
  .logo svg { height: 64px; width: auto; display: block; }
  .title-group { min-width: 0; border-left: 2px solid var(--green); padding-left: 16px; }
  .title-group h1 { font-size: 22px; font-weight: 800; letter-spacing: 0.01em; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .title-group p { color: var(--text-soft); font-size: 13px; margin-top: 2px; }
  .header-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .date-badge {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 7px 16px;
    font-size: 12px;
    color: var(--text-soft);
    display: flex; align-items: center; gap: 8px;
    box-shadow: var(--shadow);
  }
  .date-badge .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); box-shadow: 0 0 6px var(--green-light); }
  .btn {
    background: linear-gradient(135deg, var(--green), var(--green-dark));
    color: #fff; border: none; border-radius: 8px;
    padding: 8px 16px; font-size: 13px; font-weight: 600;
    cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
    box-shadow: 0 3px 10px rgba(0, 146, 63, 0.28);
    transition: transform .12s ease, box-shadow .18s ease, filter .15s ease;
    white-space: nowrap;
  }
  .btn:hover { filter: brightness(1.08); box-shadow: 0 4px 14px rgba(0, 146, 63, 0.35); }
  .btn:active { transform: translateY(1px); }
  .btn svg { width: 14px; height: 14px; }
  .btn.ghost {
    background: var(--surface); border: 1px solid var(--border);
    box-shadow: var(--shadow); color: var(--text-soft);
  }
  .btn.ghost:hover { color: var(--green); border-color: var(--green); }

  /* ===== 主区域 ===== */
  .main {
    flex: 1;
    min-height: 0;
    overflow: hidden;
    display: flex;
    gap: 14px;
    margin-top: 10px;
  }

  /* ===== 左侧栏 ===== */
  .sidebar {
    width: 300px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    gap: 12px;
    min-height: 0;
    overflow: hidden;
  }
  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
  }

  /* 总览 */
  .overview { padding: 16px 18px; flex-shrink: 0; }
  .overview-item {
    display: flex; align-items: baseline; justify-content: space-between;
    padding: 10px 0;
    border-bottom: 1px solid var(--border-soft);
  }
  .overview-item:last-child { border-bottom: none; }
  .overview-item .lbl { color: var(--text-mute); font-size: 13px; }
  .overview-item .val { font-size: 24px; font-weight: 800; color: var(--text); }
  .overview-item .val .unit { font-size: 13px; font-weight: 500; color: var(--text-soft); margin-left: 2px; }

  /* 环形图（放大） */
  .donut-card {
    flex: 1;
    min-height: 0;
    overflow: hidden;
    padding: 16px;
    display: flex;
    flex-direction: column;
  }
  .donut-card .chart-title { font-size: 14px; font-weight: 700; color: var(--text); margin-bottom: 2px; }
  .donut-card .chart-sub { color: var(--text-mute); font-size: 11px; margin-bottom: 10px; }
  .donut-wrap {
    flex: 1;
    min-height: 0;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
  }
  .donut { position: relative; width: 190px; height: 190px; flex-shrink: 0; }
  .donut svg { transform: rotate(-90deg); width: 100%; height: 100%; }
  .donut-track { fill: none; stroke: #e8f0eb; stroke-width: 16; }
  .donut-fill { fill: none; stroke-width: 16; stroke-linecap: round; transition: stroke-dashoffset .9s cubic-bezier(.2,.8,.3,1); }
  .donut-center {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .donut-center .big { font-size: 38px; font-weight: 800; line-height: 1; color: var(--green); }
  .donut-center .small { color: var(--text-mute); font-size: 12px; margin-top: 5px; }
  .donut-legend {
    width: 100%;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 4px 10px;
  }
  .legend-row { display: flex; align-items: center; gap: 6px; font-size: 11px; }
  .legend-row .swatch { width: 9px; height: 9px; border-radius: 2px; flex-shrink: 0; }
  .legend-row .name { color: var(--text-soft); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .legend-row .val { margin-left: auto; font-weight: 700; color: var(--text); flex-shrink: 0; }

  /* ===== 右侧主区（仅进度卡片） ===== */
  .content {
    flex: 1;
    min-width: 0;
    min-height: 0;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* 进度卡片网格 */
  .stats-grid {
    flex: 1;
    min-height: 0;
    overflow: hidden;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-auto-rows: minmax(0, 1fr);
    gap: 12px;
  }
  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 10px 12px;
    position: relative;
    overflow: hidden;
    min-height: 0;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 6px;
    transition: border-color .18s ease, transform .18s ease, box-shadow .18s ease;
  }
  .stat-card:hover { transform: translateY(-2px); border-color: var(--green); box-shadow: var(--shadow-hover); }
  .stat-card .bar-bg {
    position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
    opacity: 0.85;
  }
  .stat-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-width: 0; }
  .stat-name { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; color: var(--text); min-width: 0; }
  .stat-name .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stat-icon {
    width: 28px; height: 28px; border-radius: 7px;
    display: grid; place-items: center;
    background: var(--green-pale);
    flex-shrink: 0;
  }
  .stat-icon svg { width: 16px; height: 16px; }
  .stat-pct { font-size: 20px; font-weight: 800; line-height: 1; flex-shrink: 0; }
  .stat-pct small { font-size: 12px; font-weight: 500; color: var(--text-mute); }
  .stat-mid { display: flex; align-items: baseline; gap: 4px; }
  .stat-mid .done { font-size: 17px; font-weight: 800; line-height: 1; color: var(--text); }
  .stat-mid .slash { color: var(--text-mute); font-size: 13px; }
  .stat-mid .total { color: var(--text-mute); font-size: 13px; }
  .progress-track {
    height: 7px; border-radius: 999px;
    background: #eef3ef;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%; border-radius: 999px;
    transition: width .6s cubic-bezier(.2,.8,.3,1);
  }

  /* ===== 材料采购紧凑行（缩小约30%，字体保持清晰） ===== */
  .proc-section {
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding-top: 8px;
  }
  .proc-section .sec-label {
    font-size: 11px;
    font-weight: 700;
    color: var(--text-soft);
    letter-spacing: 0.05em;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .proc-section .sec-label::before {
    content: "";
    width: 3px; height: 11px;
    background: var(--green);
    border-radius: 2px;
  }
  .proc-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 10px;
    min-height: 0;
  }
  .proc-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 6px 9px;
    position: relative;
    overflow: hidden;
    min-height: 0;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 3px;
    transition: border-color .18s ease, transform .18s ease, box-shadow .18s ease;
  }
  .proc-card:hover { transform: translateY(-2px); border-color: var(--green); box-shadow: var(--shadow-hover); }
  .proc-card .bar-bg {
    position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
    opacity: 0.85;
  }
  .proc-top { display: flex; align-items: center; justify-content: space-between; gap: 6px; min-width: 0; }
  .proc-name { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--text); min-width: 0; }
  .proc-name .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .proc-icon {
    width: 22px; height: 22px; border-radius: 6px;
    display: grid; place-items: center;
    background: var(--green-pale);
    flex-shrink: 0;
  }
  .proc-icon svg { width: 13px; height: 13px; }
  .proc-pct { font-size: 15px; font-weight: 800; line-height: 1; flex-shrink: 0; }
  .proc-pct small { font-size: 10px; font-weight: 500; color: var(--text-mute); }
  .proc-mid { display: flex; align-items: baseline; gap: 3px; }
  .proc-mid .done { font-size: 13px; font-weight: 800; line-height: 1; color: var(--text); }
  .proc-mid .slash { color: var(--text-mute); font-size: 11px; }
  .proc-mid .total { color: var(--text-mute); font-size: 11px; }
  .proc-track {
    height: 5px; border-radius: 999px;
    background: var(--track);
    overflow: hidden;
    flex-shrink: 0;
  }
  .proc-fill {
    height: 100%; border-radius: 999px;
    transition: width .6s cubic-bezier(.2,.8,.3,1);
  }

  /* ===== 弹窗 ===== */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(20, 40, 28, 0.45);
    backdrop-filter: blur(4px);
    display: flex; align-items: center; justify-content: center;
    z-index: 100; animation: fade .18s ease;
  }
  @keyframes fade { from { opacity: 0; } }
  .modal {
    background: #ffffff;
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 24px;
    width: 680px; max-width: 92vw;
    max-height: 88vh; overflow-y: auto;
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.18);
    animation: pop .22s cubic-bezier(.2,.8,.3,1);
  }
  @keyframes pop { from { transform: translateY(12px) scale(.97); opacity: 0; } }
  .modal h2 { font-size: 19px; font-weight: 800; color: var(--text); margin-bottom: 4px; }
  .modal .sub { color: var(--text-soft); font-size: 13px; margin-bottom: 20px; }
  .edit-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .field label { display: block; color: var(--text-soft); font-size: 13px; margin-bottom: 6px; font-weight: 500; }
  .field input {
    width: 100%;
    background: #f7faf8;
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 9px 11px;
    color: var(--text);
    font-size: 14px;
    font-family: var(--font);
    outline: none;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  .field input:focus { border-color: var(--green); box-shadow: 0 0 0 3px rgba(0, 146, 63, 0.15); }
  .field-row { display: flex; gap: 8px; }
  .field-row .field { flex: 1; }
  .modal-actions { display: flex; align-items: center; gap: 10px; margin-top: 22px; }
  .spacer { flex: 1; }
  .hint { color: var(--text-mute); font-size: 12px; margin-top: 6px; }

  /* ===== 响应式 ===== */
  @media (max-width: 1280px) {
    .stats-grid { grid-template-columns: repeat(3, 1fr); }
    .sidebar { width: 270px; }
    .donut { width: 165px; height: 165px; }
    .donut-center .big { font-size: 32px; }
  }
  @media (max-width: 900px) {
    .sidebar { width: 240px; }
    .donut { width: 145px; height: 145px; }
    .donut-center .big { font-size: 28px; }
    .stats-grid { gap: 8px; }
    .stat-card { padding: 8px 10px; gap: 5px; }
    .stat-name { font-size: 12px; }
    .stat-pct { font-size: 17px; }
    .stat-mid .done { font-size: 15px; }
  }
  @media (max-width: 640px) {
    html, body { overflow: auto; height: auto; }
    .wrap { height: auto; }
    .main { flex-direction: column; }
    .sidebar { width: 100%; }
    .donut-card { flex: none; }
    .stats-grid { grid-template-columns: repeat(2, 1fr); grid-auto-rows: auto; }
  }

  /* ===== 打印友好 ===== */
  @media print {
    body { padding: 0; height: auto; overflow: visible; }
    .btn { display: none; }
  }
</style>
</head>

  drawing: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M9 13h6"/><path d="M9 17h6"/></svg>',
  foundDrawing: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M8 14h8"/><path d="M8 18h8"/><path d="M9 14v4M15 14v4"/></svg>',
  towerDrawing: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M12 12l-2 7M12 12l2 7"/><path d="M10 14h4"/></svg>',
  elecDrawing: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M13 12l-3 4h3l-1 4"/></svg>',
  rebar: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/><path d="M7 3v3M7 15v3M17 3v3M17 15v3M12 3v3M12 15v3"/></svg>',
  anchorBolt: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6l-1 5H10l-1-5z"/><path d="M10 8v10M14 8v10"/><path d="M10 12h4M10 16h4"/><path d="M8 18h8"/></svg>',
  towerProc: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><path d="M3.27 6.96 12 12.01l8.73-5.05"/><path d="M12 22.08V12"/></svg>',
  conductor: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20c4 0 4-16 8-16s4 16 8 16"/><path d="M4 14c4 0 4-10 8-10s4 10 8 10"/><circle cx="4" cy="20" r="1"/><circle cx="20" cy="20" r="1"/></svg>',
  fitting: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>',
};

/* ===== 数据存储 ===== */
const store = {
  load() {
    const raw = localStorage.getItem(CONFIG.storageKey);
    if (raw) {
      try {
        const saved = JSON.parse(raw);
        const data = { ...structuredClone(CONFIG.seed) };
        if (saved.data) {
          Object.keys(saved.data).forEach(k => { if (data[k]) data[k] = { ...data[k], ...saved.data[k] }; });
        }
        const project = { ...CONFIG.project, ...(saved.project || {}) };
        return { data, project };
      } catch (e) {}
    }
    return { data: structuredClone(CONFIG.seed), project: { ...CONFIG.project } };
  },
  save(state) { localStorage.setItem(CONFIG.storageKey, JSON.stringify(state)); },
};

let state = store.load();
const $ = s => document.querySelector(s);

/* ===== 工具函数 ===== */
const pct = (done, total) => total > 0 ? Math.round((done / total) * 100) : 0;
const fmt = n => Number(n).toLocaleString("zh-CN");
const todayStr = () => {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
};

$("#today-date").textContent = todayStr();

/* ===== 渲染总览 ===== */
function renderOverview() {
  const totalDone = CONFIG.categories.reduce((s, c) => s + (state.data[c.key]?.done || 0), 0);
  const totalAll = CONFIG.categories.reduce((s, c) => s + (state.data[c.key]?.total || 0), 0);
  const avgPct = pct(totalDone, totalAll);
  const doneCats = CONFIG.categories.filter(c => pct(state.data[c.key].done, state.data[c.key].total) === 100).length;

  $("#project-title").textContent = state.project.title;
  $("#project-subtitle").textContent = state.project.subtitle;

  $("#overview").innerHTML = `
    <div class="overview-item"><span class="lbl">总塔基数</span><span class="val">${fmt(state.project.totalTowers)}<span class="unit">基</span></span></div>
    <div class="overview-item"><span class="lbl">综合完成率</span><span class="val" style="color:var(--green)">${avgPct}<span class="unit">%</span></span></div>
    <div class="overview-item"><span class="lbl">已全完成分项</span><span class="val">${doneCats}<span class="unit">/ ${CONFIG.categories.length}</span></span></div>
  `;
}

/* ===== 渲染进度卡片 ===== */
function renderStats() {
  const MAIN = ["permanentLand","temporaryLand","foundation","tower","stringing","foundDrawing","towerDrawing","elecDrawing"];
  $("#stats-grid").innerHTML = CONFIG.categories.filter(c => MAIN.includes(c.key)).map(c => {
    const d = state.data[c.key];
    const p = pct(d.done, d.total);
    return `
      <div class="stat-card">
        <div class="bar-bg" style="background:${c.color}"></div>
        <div class="stat-top">
          <div class="stat-name">
            <span class="stat-icon" style="color:${c.color}">${ICONS[c.icon] || ""}</span>
            <span class="nm">${c.label}</span>
          </div>
          <div class="stat-pct" style="color:${c.color}">${p}<small>%</small></div>
        </div>
        <div class="stat-mid">
          <span class="done">${fmt(d.done)}</span>
          <span class="slash">/</span>
          <span class="total">${fmt(d.total)}</span>
        </div>
        <div class="progress-track">
          <div class="progress-fill" style="width:${p}%;background:linear-gradient(90deg,${c.color}bb,${c.color})"></div>
        </div>
      </div>`;
  }).join("");
}

/* ===== 渲染材料采购紧凑行（5项，缩小约30%，字体保持清晰） ===== */
function renderProc() {
  const PROC = ["rebar","anchorBolt","towerProc","conductor","fitting"];
  $("#proc-grid").innerHTML = CONFIG.categories.filter(c => PROC.includes(c.key)).map(c => {
    const d = state.data[c.key];
    const p = pct(d.done, d.total);
    return `
      <div class="proc-card">
        <div class="bar-bg" style="background:${c.color}"></div>
        <div class="proc-top">
          <div class="proc-name">
            <span class="proc-icon" style="color:${c.color}">${ICONS[c.icon] || ""}</span>
            <span class="nm">${c.label}</span>
          </div>
          <div class="proc-pct" style="color:${c.color}">${p}<small>%</small></div>
        </div>
        <div class="proc-mid">
          <span class="done">${fmt(d.done)}</span>
          <span class="slash">/</span>
          <span class="total">${fmt(d.total)}</span>
        </div>
        <div class="proc-track">
          <div class="proc-fill" style="width:${p}%;background:linear-gradient(90deg,${c.color}bb,${c.color})"></div>
        </div>
      </div>`;
  }).join("");
}

/* ===== 渲染环形图 ===== */
function renderDonut() {
  const totalDone = CONFIG.categories.reduce((s, c) => s + (state.data[c.key]?.done || 0), 0);
  const totalAll = CONFIG.categories.reduce((s, c) => s + (state.data[c.key]?.total || 0), 0);
  const avg = pct(totalDone, totalAll);
  const circ = 2 * Math.PI * 48;
  $("#donut-fill").setAttribute("stroke-dasharray", circ);
  $("#donut-fill").setAttribute("stroke-dashoffset", circ * (1 - avg / 100));
  $("#donut-pct").textContent = avg + "%";

  $("#donut-legend").innerHTML = CONFIG.categories.map(c => {
    const d = state.data[c.key];
    const p = pct(d.done, d.total);
    return `<div class="legend-row">
      <span class="swatch" style="background:${c.color}"></span>
      <span class="name">${c.label}</span>
      <span class="val">${p}%</span>
    </div>`;
  }).join("");
}

/* ===== 整体渲染 ===== */
function render() {
  renderOverview();
  renderStats();
  renderProc();
  renderDonut();
}

/* ===== 编辑进度弹窗 ===== */
function openEditModal() {
  const fields = CONFIG.categories.map(c => {
    const d = state.data[c.key];
    return `
      <div class="field">
        <label>${c.label}（已完成 / 总数）</label>
        <div class="field-row">
          <div class="field">
            <input type="number" min="0" data-key="${c.key}" data-field="done" value="${d.done}" placeholder="已完成" />
          </div>
          <div class="field">
            <input type="number" min="1" data-key="${c.key}" data-field="total" value="${d.total}" placeholder="总数" />
          </div>
        </div>
      </div>`;
  }).join("");

  const overlay = document.createElement("div");
  overlay.className = "overlay";
  overlay.innerHTML = `<div class="modal">
    <h2>更新工程进度</h2>
    <div class="sub">请填写各分项工程的「已完成」数量与「总数」，保存后看板自动刷新</div>
    <div class="edit-grid">${fields}</div>
    <p class="hint">提示：数据仅保存在当前浏览器中，换电脑或清理浏览记录后会丢失，请注意备份。</p>
    <div class="modal-actions">
      <button class="btn ghost" id="m-cancel">取消</button>
      <div class="spacer"></div>
      <button class="btn" id="m-save">保存更新</button>
    </div>
  </div>`;
  document.body.appendChild(overlay);

  const close = () => overlay.remove();
  overlay.onclick = e => { if (e.target === overlay) close(); };
  overlay.querySelector("#m-cancel").onclick = close;
  overlay.querySelector("#m-save").onclick = () => {
    overlay.querySelectorAll("input[data-key]").forEach(inp => {
      const k = inp.dataset.key, f = inp.dataset.field;
      const v = parseInt(inp.value, 10);
      if (!isNaN(v) && v >= 0) state.data[k][f] = v;
    });
    store.save(state);
    render();
    close();
  };
}

/* ===== 工程信息弹窗 ===== */
function openProjectModal() {
  const overlay = document.createElement("div");
  overlay.className = "overlay";
  overlay.innerHTML = `<div class="modal" style="width:460px">
    <h2>工程信息设置</h2>
    <div class="sub">修改工程名称、副标题与总塔基数</div>
    <div class="field">
      <label>工程名称</label>
      <input id="p-title" value="${state.project.title}" />
    </div>
    <div class="field">
      <label>副标题</label>
      <input id="p-subtitle" value="${state.project.subtitle}" />
    </div>
    <div class="field">
      <label>总塔基数</label>
      <input id="p-towers" type="number" min="0" value="${state.project.totalTowers}" />
    </div>
    <div class="modal-actions">
      <button class="btn ghost" id="p-cancel">取消</button>
      <div class="spacer"></div>
      <button class="btn" id="p-save">保存</button>
    </div>
  </div>`;
  document.body.appendChild(overlay);
  const close = () => overlay.remove();
  overlay.onclick = e => { if (e.target === overlay) close(); };
  overlay.querySelector("#p-cancel").onclick = close;
  overlay.querySelector("#p-save").onclick = () => {
    state.project.title = overlay.querySelector("#p-title").value.trim() || "输电线路工程管理看板";
    state.project.subtitle = overlay.querySelector("#p-subtitle").value.trim();
    const t = parseInt(overlay.querySelector("#p-towers").value, 10);
    if (!isNaN(t) && t >= 0) state.project.totalTowers = t;
    store.save(state);
    render();
    close();
  };
}

/* ===== 绑定事件 ===== */
$("#btn-edit").onclick = openEditModal;
$("#btn-project").onclick = openProjectModal;

/* ===== 启动 ===== */
render();
</script>
</body>
</html>
